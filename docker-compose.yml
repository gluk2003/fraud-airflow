x-airflow: &airflow
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: local-homework-secret
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__CORE__PARALLELISM: '4'
    ARTIFACT_ROOT: /artifacts
    BATCH_SIZE: '3000'
    HISTORY_MONTHS: '36'
  volumes:
    - ./artifacts:/artifacts
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airflow']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  artifacts-init:
    image: alpine:3.21
    user: root
    volumes:
      - ./artifacts:/artifacts
    command: ['sh', '-c', 'mkdir -p /artifacts/models /artifacts/reports /artifacts/runs && chmod -R a+rwX /artifacts']

  warehouse-init:
    build: .
    user: "50000:0"
    environment:
      ARTIFACT_ROOT: /artifacts
    volumes:
      - ./artifacts:/artifacts
    command: ['python', '-c', 'from pipeline.tasks import initialize; initialize()']
    depends_on:
      artifacts-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      warehouse-init:
        condition: service_completed_successfully
    command:
      - bash
      - -ec
      - >-
        airflow db migrate;
        airflow users list --output json | python -c 'import json,sys; sys.exit(0 if any(u["username"] == "admin" for u in json.load(sys.stdin)) else 1)' ||
        airflow users create --username admin --password admin --firstname Local --lastname Admin --role Admin --email admin@example.org

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - '127.0.0.1:8081:8080'
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/health']
      interval: 15s
      timeout: 10s
      retries: 20

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8974/health']
      interval: 15s
      timeout: 10s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-ec']
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic scores --partitions 1 --replication-factor 1

  scorer:
    build: .
    user: "50000:0"
    environment:
      ARTIFACT_ROOT: /artifacts
      STREAM_ROLE: score
    volumes:
      - ./artifacts:/artifacts
    depends_on:
      warehouse-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  simulator:
    build: .
    environment:
      STREAM_ROLE: simulate
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  reports:
    image: nginx:1.27-alpine
    volumes:
      - ./artifacts/reports:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8082:80'
    depends_on:
      artifacts-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-db:
  airflow-logs:
